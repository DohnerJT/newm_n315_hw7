<!-- <h1>Hey Michael, Edit Your Recipe!</h1> -->

<form >

    <fieldset id="description">
        <div class="fileBtn" style="cursor: pointer;">Attach file</div>
        <input type="text" name="file" placeholder="Edit Recipe Image"/>
        <input type="text" name="name" required placeholder="Recipe Name"/>
        <input type="text" name="description" placeholder="Recipe Description"/>
        <input type="text" name="time" placeholder="Recipe Total Time"/>
        <input type="text" name="size" placeholder="Recipe Serving Size"/>
    </fieldset>

    <fieldset id="in">
        <h2>Enter Ingredients:</h2>
        <!-- <input type="text" name="in1" placeholder="Ingredient 1"/> -->
        <div class="addBtn" style="cursor: pointer;">+</div>
    </fieldset>

    <fieldset id="step">
        <h2>Enter Instructions:</h2>
        <!-- <input type="text" name="step1" placeholder="Instruction 1"/> -->
        <div class="addBtn" style="cursor: pointer;" >+</div>
    </fieldset>

    <button type="submit" id="save_recipe">Submit Changes"</button>
</form>
